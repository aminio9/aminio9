<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Mohammadhassan Amini animated Linux terminal</title>
  <desc id="desc">An animated terminal with ASCII Tux and commands describing a Python and Go developer and DevOps engineer.</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1728"/>
      <stop offset="1" stop-color="#06101a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="line1"><rect x="480" y="98" height="56"><animate attributeName="width" values="0;0;650;650;0" keyTimes="0;0.04;0.18;0.98;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line2"><rect x="480" y="153" height="56"><animate attributeName="width" values="0;0;650;650;0" keyTimes="0;0.20;0.36;0.98;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line3"><rect x="480" y="208" height="56"><animate attributeName="width" values="0;0;650;650;0" keyTimes="0;0.38;0.54;0.98;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="line4"><rect x="480" y="263" height="56"><animate attributeName="width" values="0;0;650;650;0" keyTimes="0;0.56;0.78;0.98;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .mono { font-family: "Cascadia Code", "Fira Code", Consolas, monospace; }
      .dim { fill: #64748b; }
      .cyan { fill: #22d3ee; }
      .green { fill: #4ade80; }
      .white { fill: #e2e8f0; }
      .node { fill: #0f1d2d; stroke: #334155; stroke-width: 2; }
      .nodeText { font: 700 14px "Cascadia Code", Consolas, monospace; fill: #cbd5e1; text-anchor: middle; }
      @keyframes blink { 0%,45% { opacity:1 } 46%,100% { opacity:0 } }
      @keyframes pulse { 0%,100% { opacity:.45 } 50% { opacity:1 } }
      .cursor { animation: blink 1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="8" y="8" width="1184" height="504" rx="18" fill="#020617" opacity=".35" filter="url(#glow)"/>
  <rect x="10" y="10" width="1180" height="500" rx="16" fill="url(#shell)" stroke="#1e293b" stroke-width="2"/>
  <path d="M26 10h1148a16 16 0 0 1 16 16v42H10V26A16 16 0 0 1 26 10z" fill="url(#bar)"/>
  <circle cx="42" cy="39" r="7" fill="#ff5f57"/>
  <circle cx="66" cy="39" r="7" fill="#febc2e"/>
  <circle cx="90" cy="39" r="7" fill="#28c840"/>
  <text x="600" y="45" class="mono dim" font-size="15" text-anchor="middle">mohammadhassan@linux: ~/platform-engineering</text>

  <g transform="translate(56 92)">
    <animateTransform attributeName="transform" type="translate" values="56 92;56 86;56 92" dur="3.2s" repeatCount="indefinite"/>
    <text class="mono white" font-size="22" xml:space="preserve">
      <tspan x="60" y="0">         .--.</tspan>
      <tspan x="60" y="30">        |o_o |</tspan>
      <tspan x="60" y="60">        |:_/ |</tspan>
      <tspan x="60" y="90">       //   \ \</tspan>
      <tspan x="60" y="120">      (|     | )</tspan>
      <tspan x="60" y="150">     /'\_   _/`\</tspan>
      <tspan x="60" y="180">     \___)=(___/</tspan>
    </text>
    <text x="160" y="222" class="mono cyan pulse" font-size="15" text-anchor="middle">LINUX // AUTOMATION // SRE</text>
  </g>

  <g class="mono" font-size="21">
    <g clip-path="url(#line1)">
      <text x="480" y="120"><tspan class="green">aminio9@github</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="white">$ whoami</tspan></text>
      <text x="480" y="151" class="white" font-size="17">Mohammadhassan Amini // DevOps · SRE · Software Engineer</text>
    </g>
    <g clip-path="url(#line2)">
      <text x="480" y="175"><tspan class="green">aminio9@github</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="white">$ cat stack.txt</tspan></text>
      <text x="480" y="206" class="white" font-size="17">Python · Go · Bash · Docker · Kubernetes · Ansible</text>
    </g>
    <g clip-path="url(#line3)">
      <text x="480" y="230"><tspan class="green">aminio9@github</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="white">$ ./deploy --safe --observable</tspan></text>
      <text x="480" y="261" class="white" font-size="17">pipeline: lint → test → build → ship → measure</text>
    </g>
    <g clip-path="url(#line4)">
      <text x="480" y="285"><tspan class="green">aminio9@github</tspan><tspan class="dim">:</tspan><tspan class="cyan">~</tspan><tspan class="white">$ echo $MISSION</tspan></text>
      <text x="480" y="316" class="white" font-size="17">Reliable systems. Reproducible delivery. Calm operations.</text>
    </g>
    <rect x="1127" y="297" width="11" height="22" rx="1" class="green cursor"/>
  </g>

  <g transform="translate(0 3)">
    <path d="M105 412H1095" fill="none" stroke="#1e3a4a" stroke-width="3" stroke-dasharray="7 9"/>
    <g><rect class="node" x="80" y="385" width="150" height="54" rx="10"/><text class="nodeText" x="155" y="417">CODE</text></g>
    <g><rect class="node" x="302" y="385" width="150" height="54" rx="10"/><text class="nodeText" x="377" y="417">TEST</text></g>
    <g><rect class="node" x="524" y="385" width="150" height="54" rx="10"/><text class="nodeText" x="599" y="417">IMAGE</text></g>
    <g><rect class="node" x="746" y="385" width="150" height="54" rx="10"/><text class="nodeText" x="821" y="417">CLUSTER</text></g>
    <g><rect class="node" x="968" y="385" width="150" height="54" rx="10"/><text class="nodeText" x="1043" y="417">OBSERVE</text></g>
    <circle r="7" fill="#22d3ee" filter="url(#glow)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M105 412H1095"/>
    </circle>
  </g>

  <text x="58" y="480" class="mono dim" font-size="14">uptime: learning continuously</text>
  <text x="1142" y="480" class="mono green pulse" font-size="14" text-anchor="end">● systems operational</text>
</svg>
